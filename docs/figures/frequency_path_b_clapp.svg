<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#172033}.c{stroke:#172033;stroke-width:3;fill:none}.v{fill:#fff4dd;stroke:#b46b00;stroke-width:2}.n{fill:#e8f1ff;stroke:#2b5fab;stroke-width:2}.s{font-size:18px}.t{font-size:24px;font-weight:bold}.lab{font-size:16px}</style><rect width="1200" height="760" fill="white"/><text x="40" y="45" class="t">Path-B：10 MHz 低功耗 common-base Clapp VCO（实验版）</text><text x="40" y="78" class="s">首版先用固定 C3 + 微调验证起振；变容/DAC 作为后续扩展，不直接假设器件线性。</text><line x1="220" y1="125" x2="220" y2="170" class="c"/><text x="185" y="115" class="s">3.3 V</text><line x1="220" y1="170" x2="220" y2="205" class="c"/><rect x="190" y="205" width="60" height="80" class="v"/><text x="205" y="250" class="s">L2</text><line x1="220" y1="285" x2="220" y2="350" class="c"/><circle cx="220" cy="350" r="5" fill="#172033"/><text x="235" y="345" class="lab">collector</text><line x1="220" y1="350" x2="460" y2="350" class="c"/><line x1="460" y1="350" x2="460" y2="310" class="c"/><polygon points="455,310 500,350 455,390" fill="#e8f1ff" stroke="#2b5fab" stroke-width="2"/><text x="420" y="430" class="s">Q1 MMBT3904</text><line x1="500" y1="350" x2="620" y2="350" class="c"/><circle cx="620" cy="350" r="5" fill="#172033"/><text x="635" y="345" class="lab">emitter</text><line x1="620" y1="350" x2="620" y2="470" class="c"/><rect x="590" y="470" width="60" height="75" class="v"/><text x="610" y="515" class="s">R3</text><line x1="620" y1="545" x2="620" y2="600" class="c"/><line x1="590" y1="600" x2="650" y2="600" class="c"/><line x1="600" y1="610" x2="640" y2="610" class="c"/><line x1="610" y1="620" x2="630" y2="620" class="c"/><text x="680" y="520" class="lab">330–470 Ω，不旁路</text><line x1="620" y1="350" x2="620" y2="230" class="c"/><rect x="590" y="150" width="60" height="80" class="v"/><text x="610" y="195" class="s">C1</text><line x1="590" y1="150" x2="460" y2="150" class="c"/><line x1="460" y1="150" x2="460" y2="310" class="c"/><line x1="620" y1="350" x2="760" y2="350" class="c"/><line x1="760" y1="350" x2="760" y2="430" class="c"/><rect x="730" y="430" width="60" height="80" class="v"/><text x="750" y="475" class="s">C2</text><line x1="760" y1="510" x2="760" y2="600" class="c"/><line x1="730" y1="600" x2="790" y2="600" class="c"/><line x1="740" y1="610" x2="780" y2="610" class="c"/><line x1="750" y1="620" x2="770" y2="620" class="c"/><text x="815" y="475" class="lab">约 470 pF C0G</text><line x1="220" y1="350" x2="100" y2="350" class="c"/><line x1="100" y1="350" x2="100" y2="430" class="c"/><rect x="70" y="430" width="60" height="80" class="v"/><text x="90" y="475" class="s">L1</text><line x1="100" y1="510" x2="100" y2="550" class="c"/><rect x="70" y="550" width="60" height="80" class="v"/><text x="90" y="595" class="s">C3</text><line x1="100" y1="630" x2="100" y2="670" class="c"/><line x1="70" y1="670" x2="130" y2="670" class="c"/><line x1="80" y1="680" x2="120" y2="680" class="c"/><line x1="90" y1="690" x2="110" y2="690" class="c"/><text x="150" y="595" class="lab">L1≈3.9 µH；C3≈82 pF+5–30 pF</text><text x="40" y="730" class="s">C1= C2≈470 pF，L2先比较 47–100 µH RFC 与 1–2.2 kΩ有源负载；输出经隔直电容进入缓冲器，禁止 collector 直接接 50 Ω。</text></svg>
