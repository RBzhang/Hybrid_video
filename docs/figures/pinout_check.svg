<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="700" viewBox="0 0 1300 700"><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#172033}.b{fill:#e8f1ff;stroke:#2b5fab;stroke-width:2}.g{fill:#eef8ee;stroke:#378a46;stroke-width:2}.o{fill:#fff4dd;stroke:#b46b00;stroke-width:2}.t{font-size:24px;font-weight:bold}.s{font-size:18px}.l{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6z" fill="#334155"/></marker></defs><rect width="1300" height="700" fill="white"/><text x="40" y="45" class="t">STM32U575 + HM0360 + 频率环资源核对图</text><text x="40" y="78" class="s">这是资源分配检查图，不是 NUCLEO 板卡最终接线图；冻结 PCB 前必须核对实际载板和复用表。</text><rect x="60" y="150" width="300" height="410" rx="16" class="b"/><text x="125" y="195" class="t">HM0360</text><text x="100" y="245" class="s">RAW8 D[7:0]</text><text x="100" y="285" class="s">PIXCLK / HSYNC</text><text x="100" y="325" class="s">VSYNC / XCLK</text><text x="100" y="365" class="s">I2C / RESET / PWDN</text><text x="100" y="405" class="s">2.8 V模拟</text><text x="100" y="445" class="s">1.2 V数字</text><text x="100" y="485" class="s">I/O电平需实测确认</text><rect x="500" y="130" width="300" height="460" rx="16" class="g"/><text x="565" y="175" class="t">STM32U575</text><text x="540" y="230" class="s">DCMI：摄像头采集</text><text x="540" y="275" class="s">TIM2/TIM5：20 MHz计数</text><text x="540" y="320" class="s">LPTIM：低功耗门控/beat计数</text><text x="540" y="365" class="s">DAC1_OUT1=PA4</text><text x="540" y="410" class="s">DAC1_OUT2=PA5</text><text x="540" y="455" class="s">SRAM帧缓存/FIR/DMA</text><text x="540" y="500" class="s">PA4/PA5及复用需核对</text><rect x="940" y="170" width="270" height="380" rx="16" class="o"/><text x="995" y="215" class="t">RF频率链</text><text x="980" y="270" class="s">限幅→延迟→XOR</text><text x="980" y="315" class="s">20 MHz BPF</text><text x="980" y="360" class="s">RF pick-off</text><text x="980" y="405" class="s">节点 n×24 kHz</text><text x="980" y="450" class="s">RF开关/天线</text><path d="M360 320H500" class="l"/><path d="M800 320H940" class="l"/><text x="390" y="300" class="s">DCMI/I2C/XCLK</text><text x="820" y="300" class="s">计数/控制</text><text x="60" y="645" class="s">首版优先 Path-A，避免 DAC 与 DCMI/计数输入争用；Path-B 才分配 DAC/变容专用模拟链路。</text></svg>
