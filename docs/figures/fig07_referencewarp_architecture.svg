<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="1060" viewBox="0 0 2100 1060" role="img" aria-labelledby="title desc"><title id="title">ReferenceWarpNet：参考帧辅助视频恢复网络结构</title><desc id="desc">两个干净的参考关键帧通过共享权重的 Key Encoder，当前退化非关键帧经过 Observation Encoder；在四分之一和八分之一尺度进行流场及偏移预测，然后使用 grid_sample 将两帧参考特征对齐到当前帧，Confidence Gate 加权并经 Fusion Decoder 预测残差，与当前退化图像相加得到恢复图像。所有形状、连接线及文字均为独立 SVG 矢量对象。</desc><defs>
