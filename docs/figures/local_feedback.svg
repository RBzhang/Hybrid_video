<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#172033}.b{fill:#e8f1ff;stroke:#2b5fab;stroke-width:2}.g{fill:#eef8ee;stroke:#378a46;stroke-width:2}.o{fill:#fff4dd;stroke:#b46b00;stroke-width:2}.t{font-size:23px;font-weight:bold}.s{font-size:17px}.w{stroke:#334155;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6z" fill="#334155"/></marker></defs><rect width="1400" height="620" fill="white"/><text x="40" y="42" class="t">Tag 内本地频率检测与闭环</text><text x="40" y="72" class="s">运行反馈不依赖 SDR；SDR/频谱仪只做开发期天线端验收。</text><rect x="40" y="190" width="200" height="110" rx="12" class="o"/><text x="65" y="230" class="t">实际节点信号</text><text x="65" y="263" class="s">20 MHz ± n·24 kHz</text><path d="M240 245H315" class="w"/><rect x="315" y="190" width="220" height="110" rx="12" class="b"/><text x="340" y="230" class="t">高阻 pick-off</text><text x="335" y="263" class="s">0.1–0.5 pF或≥1 kΩ隔离</text><path d="M535 245H610" class="w"/><rect x="610" y="190" width="180" height="110" rx="12" class="b"/><text x="635" y="230" class="t">整形/分频</text><text x="635" y="263" class="s">LVC1G17 / ÷2…÷8</text><path d="M790 245H865" class="w"/><rect x="865" y="190" width="220" height="110" rx="12" class="g"/><text x="895" y="230" class="t">TIM2/TIM5</text><text x="892" y="263" class="s">5–20 ms计数窗口</text><path d="M1085 245H1160" class="w"/><rect x="1160" y="190" width="190" height="110" rx="12" class="g"/><text x="1185" y="230" class="t">STM32判定</text><text x="1180" y="263" class="s">锁定/失锁/告警</text><path d="M1255 300V400H1000V480" class="w"/><rect x="860" y="480" width="280" height="95" rx="12" class="b"/><text x="890" y="518" class="t">控制输出</text><text x="890" y="548" class="s">延迟 tap、门控、占空比；Path-B才调DAC</text><rect x="40" y="400" width="400" height="120" rx="12" class="o"/><text x="65" y="440" class="t">可选天线端混频检测</text><text x="65" y="470" class="s">与本地20 MHz参考混频 → 24 kHz beat → LPTIM计数</text><text x="65" y="498" class="s">用于验证真实 RF pick-off，而非仅验证逻辑节点。</text></svg>
