<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-label="STM32U575 PLL1 MCO 10 MHz clock synthesis electrical schematic">
<rect width="1800" height="1080" fill="#fff"/>
<rect width="1800" height="92" fill="#193a54"/>
<text x="40" y="43" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="30" font-weight="700" fill="#fff">STM32U575 PLL1 分数频率合成与 RF Switch 驱动原理图</text>
<text x="42" y="73" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" fill="#d7e7f2">HSE晶体符号 + MCU内部PLL1 + MCO输出 + 1.8V逻辑缓冲 + ADG902 SPST</text>

<!-- HSE crystal circuit -->
<rect x="40" y="120" width="470" height="475" rx="8" fill="#fbfdff" stroke="#bfd0dd" stroke-width="2"/>
<text x="64" y="158" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" fill="#254c68">A. 外部HSE参考电路</text>
<text x="70" y="222" font-family="Arial,sans-serif" font-size="18" fill="#203d55">PH0 / OSC_IN</text>
<text x="70" y="454" font-family="Arial,sans-serif" font-size="18" fill="#203d55">PH1 / OSC_OUT</text>
<!-- horizontal crystal path -->
<path d="M70 260 H215 M285 260 H445 V420 H285 M215 420 H70" fill="none" stroke="#203d55" stroke-width="2.8"/>
<!-- crystal symbol between 215 and 285 -->
<path d="M215 260 H228 M228 230 V290 M272 230 V290 M272 260 H285" fill="none" stroke="#203d55" stroke-width="3"/>
<rect x="236" y="225" width="28" height="70" fill="none" stroke="#203d55" stroke-width="2.4"/>
<text x="250" y="210" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#145b86">X1 16 MHz</text>
<!-- C1 from PH0 to ground -->
<path d="M145 260 V334 M123 334 H167 M123 360 H167 M145 360 V404" fill="none" stroke="#203d55" stroke-width="2.6"/>
<path d="M129 404 H161 M135 412 H155 M141 420 H149" fill="none" stroke="#203d55" stroke-width="2.2"/>
<text x="90" y="354" font-family="Arial,sans-serif" font-size="17" fill="#203d55">C1</text>
<!-- C2 from PH1 to ground -->
<path d="M365 420 V334 M343 334 H387 M343 360 H387 M365 360 V404" fill="none" stroke="#203d55" stroke-width="2.6"/>
<path d="M349 404 H381 M355 412 H375 M361 420 H369" fill="none" stroke="#203d55" stroke-width="2.2"/>
<text x="395" y="354" font-family="Arial,sans-serif" font-size="17" fill="#203d55">C2</text>
<text x="70" y="505" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="16" fill="#536b7c">C1/C2按晶体CL与PCB寄生计算，不能固定照抄某个电容值。</text>
<rect x="66" y="525" width="420" height="52" rx="4" fill="#fff5e5" stroke="#e2c58f"/>
<text x="80" y="548" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="15" fill="#89551f">NUCLEO-U575ZI-Q C05：X3/C59/C60可选未装。</text>
<text x="80" y="568" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="15" fill="#89551f">实验可用ST-LINK MCO 8MHz（V3E默认）或5MHz配置；先测PH0。</text>

<!-- MCU -->
<rect x="550" y="120" width="610" height="640" rx="8" fill="#f8fbfd" stroke="#7795aa" stroke-width="2.2"/>
<text x="580" y="162" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="25" font-weight="700" fill="#214c6b">U1 — STM32U575</text>
<text x="580" y="220" font-family="Arial,sans-serif" font-size="18" fill="#203d55">PH0 / HSE_IN</text>
<text x="580" y="455" font-family="Arial,sans-serif" font-size="18" fill="#203d55">PH1 / HSE_OUT</text>
<path d="M510 260 H550 M510 420 H550" stroke="#203d55" stroke-width="2.8" fill="none"/>
<rect x="630" y="270" width="450" height="260" rx="5" fill="#e8f2f9" stroke="#4c7897" stroke-width="2"/>
<text x="658" y="310" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="23" font-weight="700" fill="#1c4e70">内部 PLL1（fractional-N）</text>
<text x="658" y="355" font-family="Arial,sans-serif" font-size="19" fill="#203d55">M = 2   N = 20   R = 2</text>
<text x="658" y="395" font-family="Arial,sans-serif" font-size="19" fill="#203d55">FRACN = 0…3539（16 MHz HSE）</text>
<text x="658" y="440" font-family="Arial,sans-serif" font-size="18" fill="#203d55">PLL输入=8MHz；VCO=160…163.456MHz</text>
<text x="658" y="478" font-family="Arial,sans-serif" font-size="18" fill="#203d55">PLL1_R = SYSCLK = 80…81.728 MHz</text>
<text x="580" y="590" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" fill="#8b5a21">VOS Range 2；HCLK ≤110 MHz。P/Q关闭，仅启用R输出。</text>
<text x="580" y="628" font-family="Arial,sans-serif" font-size="18" fill="#145b86" font-weight="700">PA8 / AF0 = MCO1</text>
<text x="580" y="662" font-family="Arial,sans-serif" font-size="17" fill="#536b7c">MCO source = PLL1_R，prescaler = /8；分辨率=61.035Hz</text>
<text x="580" y="705" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="16" fill="#536b7c">CPU主频随Tag变化：80.000～81.728 MHz，需重算定时器。</text>

<!-- MCO path -->
<path d="M1160 628 H1245" fill="none" stroke="#203d55" stroke-width="2.8"/>
<circle cx="1245" cy="628" r="5" fill="#203d55"/>
<text x="1167" y="595" font-family="Arial,sans-serif" font-size="17" fill="#145b86" font-weight="700">PA8 MCO /8</text>
<text x="1170" y="658" font-family="Arial,sans-serif" font-size="17" fill="#203d55">10.000–10.216 MHz</text>

<!-- buffer -->
<rect x="1260" y="520" width="230" height="220" rx="8" fill="#f9fcff" stroke="#a9c1d2" stroke-width="2"/>
<text x="1277" y="552" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="18" font-weight="700" fill="#244d69">U2 74AUP1G17</text>
<path d="M1282 628 H1320 L1405 575 V681 L1320 628 Z" fill="#fff" stroke="#203d55" stroke-width="2.8"/>
<path d="M1405 628 H1460" stroke="#203d55" stroke-width="2.8"/>
<text x="1344" y="634" font-family="Arial,sans-serif" font-size="18" fill="#20435e" font-weight="700">A→Y</text>
<text x="1277" y="710" font-family="Arial,sans-serif" font-size="15" fill="#536b7c">VCC=1.8V，输入耐受3.6V</text>
<path d="M1245 628 H1282" stroke="#203d55" stroke-width="2.8"/>

<!-- series resistor -->
<path d="M1460 628 H1500" stroke="#203d55" stroke-width="2.8"/>
<rect x="1500" y="615" width="76" height="26" fill="#fff" stroke="#203d55" stroke-width="2"/>
<path d="M1576 628 H1620" stroke="#203d55" stroke-width="2.8"/>
<text x="1538" y="598" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#203d55">R1 22–33Ω</text>
<text x="1588" y="662" font-family="Arial,sans-serif" font-size="15" fill="#145b86">1.8V CLK</text>

<!-- ADG902 -->
<rect x="1620" y="480" width="145" height="300" rx="6" fill="#f8fbfd" stroke="#557b96" stroke-width="2"/>
<text x="1637" y="516" font-family="Arial,sans-serif" font-size="20" fill="#184b6a" font-weight="700">U3 ADG902</text>
<text x="1637" y="552" font-family="Arial,sans-serif" font-size="15" fill="#536b7c">1 VDD = 1V8</text>
<text x="1637" y="579" font-family="Arial,sans-serif" font-size="15" fill="#536b7c">2 CTRL</text>
<text x="1637" y="606" font-family="Arial,sans-serif" font-size="15" fill="#536b7c">3,5,6,7 GND</text>
<text x="1637" y="633" font-family="Arial,sans-serif" font-size="15" fill="#536b7c">4 RF1 / 8 RF2</text>
<path d="M1642 700 H1739" stroke="#203d55" stroke-width="2.8"/>
<circle cx="1652" cy="700" r="5" fill="#fff" stroke="#203d55" stroke-width="2"/>
<circle cx="1729" cy="700" r="5" fill="#fff" stroke="#203d55" stroke-width="2"/>
<path d="M1657 696 L1719 672" stroke="#203d55" stroke-width="2.8"/>
<text x="1692" y="746" text-anchor="middle" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="15" fill="#536b7c">RF匹配另行设计</text>

<!-- Image DAC -->
<rect x="50" y="790" width="800" height="205" rx="8" fill="#f7fbf8" stroke="#b9d7c7" stroke-width="2"/>
<text x="76" y="830" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" fill="#2b6c50">独立模拟图像通道（保持原方案）</text>
<text x="82" y="875" font-family="Arial,sans-serif" font-size="19" fill="#244b3c">STM32 PA5 / DAC1_OUT2</text>
<path d="M335 868 H410" stroke="#244b3c" stroke-width="2.8"/>
<rect x="410" y="840" width="170" height="56" rx="4" fill="#fff" stroke="#57836c" stroke-width="2"/>
<text x="495" y="875" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#244b3c">滤波 / 偏置</text>
<path d="M580 868 H660" stroke="#244b3c" stroke-width="2.8"/>
<rect x="660" y="840" width="165" height="56" rx="4" fill="#fff" stroke="#57836c" stroke-width="2"/>
<text x="742" y="875" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#244b3c">图像Varactor D2</text>
<text x="82" y="940" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="16" fill="#4d705f">PA5只负责图像电压；D2与PLL频率合成独立。</text>

<!-- Notes -->
<rect x="900" y="810" width="865" height="185" rx="8" fill="#fff9ec" stroke="#e7cb93" stroke-width="2"/>
<text x="928" y="848" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="22" font-weight="700" fill="#87551e">设计要点</text>
<text x="930" y="888" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" fill="#6b5637">1. 3.3V PA8不能直接连接1.8V供电的ADG902 CTRL。</text>
<text x="930" y="923" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" fill="#6b5637">2. U2输入耐受3.6V，输出1.8V；若MCU I/O也为1.8V可评估直连。</text>
<text x="930" y="958" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="17" fill="#6b5637">3. PLL锁定后再启CW；实测分数杂散、24kHz邻道相噪和OBW。</text>
<path d="M40 1030 H1760" stroke="#9eb2c0" stroke-width="1.5"/>
<text x="45" y="1058" font-family="Arial,'Noto Sans CJK SC',sans-serif" font-size="15" fill="#657c8b">Electrical concept. Verify HSE source, VOS/flash latency, PA8 pin, logic levels, fractional spurs and RF matching before PCB release.</text>
</svg>