<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1100" viewBox="0 0 1750 1100"><rect width="1750" height="1100" fill="#fff"/><rect width="1750" height="99" fill="#193953"/><text x="38" y="44" font-size="31" font-weight="700" fill="#fff" font-family="Arial,Noto Sans CJK SC,sans-serif">05   ADG902 CONTROL + RF TEST INTERFACES</text><text x="39" y="75" font-size="17" fill="#c5dcec" font-family="Arial,Noto Sans CJK SC,sans-serif">Pin-correct ADG902BRMZ MSOP-8 • RF matching is an external UNVALIDATED module</text><text x="1698" y="58" font-size="21" text-anchor="end" fill="#bfe7ff" font-family="Arial,sans-serif">Rev.C / 05/05</text><rect x="30" y="116" width="866" height="867" rx="9" stroke="#cbdae6" stroke-width="1.5" fill="#f9fcfe"/><text x="49" y="149" font-size="22" fill="#244b68" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">A. ADG902 switch, control and supply</text><rect x="918" y="116" width="807" height="867" rx="9" stroke="#cbdae6" stroke-width="1.5" fill="#f9fcfe"/><text x="937" y="149" font-size="22" fill="#244b68" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">B. RF1/RF2 interfaces, separate video DAC</text><rect x="64" y="223" width="100" height="32" rx="5" stroke="#b2d6e9" stroke-width="1.5" fill="#e2f3fc"/><text x="72" y="245" font-size="16" fill="#075f90" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">RF_CLK</text><path d="M165 240 L225 240" fill="none" stroke="#244761" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="224" y="198" width="564" height="429" rx="5" stroke="#5e84a0" stroke-width="1.5" fill="#eaf3fa"/><text x="261" y="240" font-size="24" fill="#15405c" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">U7 — ADG902BRMZ MSOP-8</text><text x="260" y="287" font-size="19" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >Pin 1  VDD  →  1V8 (100nF bypass)</text><text x="260" y="324" font-size="19" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >Pin 2  CTRL → RF_CLK</text><text x="260" y="361" font-size="19" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >Pin 3  GND  →  GND</text><text x="260" y="398" font-size="19" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >Pin 4  RF1  →  RF_PORT_1</text><text x="260" y="435" font-size="19" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >Pin 5  GND  →  GND</text><text x="260" y="472" font-size="19" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >Pin 6  GND  →  GND</text><text x="260" y="509" font-size="19" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >Pin 7  GND  →  GND</text><text x="260" y="546" font-size="19" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >Pin 8  RF2  →  RF_PORT_2</text><rect x="636" y="632" width="108" height="32" rx="5" stroke="#b2d6e9" stroke-width="1.5" fill="#e2f3fc"/><text x="644" y="654" font-size="16" fill="#075f90" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">RF_PORT_1</text><rect x="636" y="693" width="108" height="32" rx="5" stroke="#b2d6e9" stroke-width="1.5" fill="#e2f3fc"/><text x="644" y="715" font-size="16" fill="#075f90" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">RF_PORT_2</text><rect x="66" y="822" width="770" height="128" rx="5" stroke="#e8cf91" stroke-width="1.5" fill="#fff8e8"/><text x="82" y="854" font-size="16" fill="#89541f" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">CTRL=0: RF1↔RF2 isolated; CTRL=1: RF1↔RF2 connected.</text><text x="82" y="881" font-size="16" fill="#6d5839" font-family="Arial,Noto Sans CJK SC,sans-serif" >This is a reflective SPST part, NOT a finished RF load network.</text><text x="82" y="908" font-size="16" fill="#6d5839" font-family="Arial,Noto Sans CJK SC,sans-serif" >CTRL high must not exceed VDD; keep 1.8 V logic.</text><rect x="967" y="224" width="705" height="299" rx="5" stroke="#91b5cb" stroke-width="1.5" fill="#f2f9fc"/><text x="994" y="260" font-size="24" fill="#174563" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">JRF — optional 2x RF connectors</text><text x="1000" y="318" font-size="19" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >JRF1  ↔ RF_PORT_1 (antenna/matching measurement)</text><text x="1000" y="365" font-size="19" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >JRF2  ↔ RF_PORT_2 (variable-load test board)</text><text x="1000" y="426" font-size="17" fill="#bb5c24" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">RF matching / bias tee / antenna network is NOT designed</text><rect x="976" y="579" width="108" height="32" rx="5" stroke="#b2d6e9" stroke-width="1.5" fill="#e2f3fc"/><text x="984" y="601" font-size="16" fill="#075f90" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">VIDEO_DAC</text><text x="1092" y="610" font-size="17" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >STM32 PA5 separate analog image DAC output</text><rect x="987" y="650" width="669" height="156" rx="5" stroke="#e9c488" stroke-width="1.5" fill="#f9f4eb"/><text x="1012" y="694" font-size="21" fill="#825322" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">D2 IMAGE VARACTOR + MATCHING</text><text x="1012" y="732" font-size="17" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >External RF module after VNA Γ(V) characterization.</text><text x="1012" y="765" font-size="17" fill="#b35c21" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">D2 is NOT VCO tuning varactor D1.</text><rect x="959" y="857" width="738" height="98" rx="5" stroke="#e8cf91" stroke-width="1.5" fill="#fff8e8"/><text x="975" y="889" font-size="16" fill="#89541f" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">Actual RF image front-end remains a separate RF validation task.</text><text x="975" y="916" font-size="16" fill="#6d5839" font-family="Arial,Noto Sans CJK SC,sans-serif" >Do not fabricate an antenna-ready Tag using these connector drawings alone.</text><path d="M35 1058h1680" stroke="#9eb4c4"/><text x="40" y="1082" font-size="15" fill="#516778" font-family="Arial,sans-serif">Electrical design draft — netlist.csv defines connectivity — check datasheets, SPICE, ERC and bench before PCB release.</text></svg>