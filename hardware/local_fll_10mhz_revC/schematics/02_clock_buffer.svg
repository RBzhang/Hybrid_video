s-serif" font-size="16" fill="#694e2e" >Check fanout, input capacitance, 1.8 V logic thresholds and series damping on actual PCB.</text><path d="M35 1058h1680" stroke="#9eb4c4"/><text x="40" y="1082" font-size="15" fill="#516778" font-family="Arial,sans-serif">Electrical prototype schematic — see netlist.csv for authoritative named-net connectivity — not fabrication validated</text></svg>