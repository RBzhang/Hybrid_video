<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1100" viewBox="0 0 1750 1100"><rect width="1750" height="1100" fill="#fff"/><rect width="1750" height="99" fill="#193953"/><text x="38" y="44" font-size="31" font-weight="700" fill="#fff" font-family="Arial,Noto Sans CJK SC,sans-serif">04   STM32 INTERFACE + LSE GATE + 1.8 V POWER</text><text x="39" y="75" font-size="17" fill="#c5dcec" font-family="Arial,Noto Sans CJK SC,sans-serif">NUCLEO-U575ZI-Q as host • external PB2→PA0 strap • DAC PA4 tune • TPS7A02-1.8 LDO</text><text x="1698" y="58" font-size="21" text-anchor="end" fill="#bfe7ff" font-family="Arial,sans-serif">Rev.C / 04/05</text><rect x="30" y="115" width="830" height="874" rx="9" stroke="#cbdae6" stroke-width="1.5" fill="#f9fcfe"/><text x="49" y="148" font-size="22" fill="#244b68" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">A. Interface J1: adapter PCB, not Nucleo expansion header numbering</text><rect x="881" y="115" width="841" height="408" rx="9" stroke="#cbdae6" stroke-width="1.5" fill="#f9fcfe"/><text x="900" y="148" font-size="22" fill="#244b68" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">B. 1.8 V LDO, verified 5-pin DBV wiring</text><rect x="881" y="542" width="841" height="447" rx="9" stroke="#cbdae6" stroke-width="1.5" fill="#f9fcfe"/><text x="900" y="575" font-size="22" fill="#244b68" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">C. Tune DAC external sample hold and RC filter</text><rect x="95" y="222" width="706" height="475" rx="5" stroke="#6687a0" stroke-width="1.5" fill="#eaf4fa"/><text x="128" y="260" font-size="22" fill="#194866" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">J1 — proposed 8-pin expansion wiring</text><text x="130" y="313" font-size="18" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >1  PA4  DAC1_OUT1        → DAC_HOLD</text><text x="130" y="360" font-size="18" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >2  PA5  DAC1_OUT2        → VIDEO_DAC</text><text x="130" y="407" font-size="18" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >3  PA15 TIM2_ETR (AF2) ← TIM_ETR_3V3</text><text x="130" y="454" font-size="18" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >4  PA0  TIM2_CH1 (AF1) ← FLL_GATE_IN</text><text x="130" y="501" font-size="18" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >5  PB2  LPTIM1_CH1 (AF1) → FLL_GATE_OUT</text><text x="130" y="548" font-size="18" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >6  3V3 board supply      → 3V3</text><text x="130" y="595" font-size="18" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >7  GND return           → GND</text><text x="130" y="642" font-size="18" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >8  LSE onboard PC14/15  (host circuit)</text><rect x="85" y="744" width="715" height="173" rx="5" stroke="#e8cf91" stroke-width="1.5" fill="#fff8e8"/><text x="101" y="776" font-size="16" fill="#89541f" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">R_GATE = 0 Ω: connect PB2/LPTIM1_CH1 → PA0/TIM2_CH1 externally.</text><text x="101" y="803" font-size="16" fill="#6d5839" font-family="Arial,Noto Sans CJK SC,sans-serif" >TIM2 ETR receives DIV16 on PA15; ECE=1 plus gated SMS/TI1.</text><text x="101" y="830" font-size="16" fill="#6d5839" font-family="Arial,Noto Sans CJK SC,sans-serif" >Verify AF conflicts with DCMI, Nucleo CN mapping and clock source.</text><text x="101" y="857" font-size="16" fill="#6d5839" font-family="Arial,Noto Sans CJK SC,sans-serif" >TIM2 cannot be assumed active throughout STM32 STOP modes.</text><rect x="917" y="201" width="100" height="32" rx="5" stroke="#b2d6e9" stroke-width="1.5" fill="#e2f3fc"/><text x="925" y="223" font-size="16" fill="#075f90" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">3V3</text><rect x="1041" y="209" width="585" height="256" rx="5" stroke="#658aa4" stroke-width="1.5" fill="#e8f4fb"/><text x="1068" y="246" font-size="23" fill="#18425f" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">U6  TPS7A02-1.8 (DBV-5)</text><text x="1068" y="291" font-size="19" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >1  IN = 3V3</text><text x="1068" y="326" font-size="19" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >2  GND = GND</text><text x="1068" y="361" font-size="18" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >3  EN = 3V3 (through strap/pull-up)</text><text x="1068" y="396" font-size="19" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >4  NC = open       5  OUT = 1V8</text><rect x="1513" y="454" width="100" height="32" rx="5" stroke="#b2d6e9" stroke-width="1.5" fill="#e2f3fc"/><text x="1521" y="476" font-size="16" fill="#075f90" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">1V8</text><text x="933" y="501" font-size="16" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >CIN=1 µF and COUT=1 µF to GND, next to U6.</text><rect x="913" y="632" width="100" height="32" rx="5" stroke="#b2d6e9" stroke-width="1.5" fill="#e2f3fc"/><text x="921" y="654" font-size="16" fill="#075f90" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">DAC_HOLD</text><path d="M1025 648 L1093 648" fill="none" stroke="#244761" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M1092 648h24 M1178 648h24" fill="none" stroke="#244761" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="1116" y="636" width="62" height="24" rx="5" stroke="#456781" stroke-width="1.5" fill="white"/><text x="1092" y="623" font-size="17" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >RFILT 100k</text><path d="M1202 648 L1476 648" fill="none" stroke="#244761" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="1480" y="617" width="100" height="32" rx="5" stroke="#b2d6e9" stroke-width="1.5" fill="#e2f3fc"/><text x="1488" y="639" font-size="16" fill="#075f90" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">VTUNE</text><circle cx="1476" cy="648" r="4.5" fill="#244761"/><path d="M1025 724v42 M1008 766h34 M1008 792h34 M1025 792v42" fill="none" stroke="#244761" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="1049" y="783" font-size="17" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >CH 100n</text><path d="M1025 648 L1025 724" fill="none" stroke="#244761" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M1025 823v11 M1009 834h32 M1015 842h20 M1020 850h10" fill="none" stroke="#244761" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M1476 724v42 M1459 766h34 M1459 792h34 M1476 792v42" fill="none" stroke="#244761" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="1500" y="783" font-size="17" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >CF 100n</text><path d="M1476 648 L1476 724" fill="none" stroke="#244761" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M1476 823v11 M1460 834h32 M1466 842h20 M1471 850h10" fill="none" stroke="#244761" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="930" y="876" width="747" height="90" rx="5" stroke="#e8cf91" stroke-width="1.5" fill="#fff8e8"/><text x="946" y="908" font-size="16" fill="#89541f" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">On-board local FLL: 125 ms LSE time gate → 128 Hz/count at ÷16.</text><text x="946" y="935" font-size="16" fill="#6d5839" font-family="Arial,Noto Sans CJK SC,sans-serif" >DAC corrections preferably at frame boundaries; evaluate DAC sample-hold ripple.</text><path d="M35 1058h1680" stroke="#9eb4c4"/><text x="40" y="1082" font-size="15" fill="#516778" font-family="Arial,sans-serif">Electrical design draft — netlist.csv defines connectivity — check datasheets, SPICE, ERC and bench before PCB release.</text><g fill="none" stroke="#244b69" stroke-width="2.5">
<path d="M105 1009H247 M320 1009H471"/><rect x="247" y="997" width="73" height="24" fill="#fff" stroke="#244b69" rx="2"/>
</g><g font-family="Arial,Noto Sans CJK SC,sans-serif" font-size="16" fill="#244b69">
<text x="100" y="996">PB2 / GATE_OUT</text><text x="251" y="991">R_GATE 0Ω</text><text x="480" y="1014">PA0 / GATE_IN</text>
</g></svg>