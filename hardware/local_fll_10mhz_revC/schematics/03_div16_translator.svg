<svg xmlns="http://www.w3.org/2000/svg" width="1750" height="1100" viewBox="0 0 1750 1100"><rect width="1750" height="1100" fill="#fff"/><rect width="1750" height="99" fill="#193953"/><text x="38" y="44" font-size="31" font-weight="700" fill="#fff" font-family="Arial,Noto Sans CJK SC,sans-serif">03   FLL DIGITAL DIVIDER / LEVEL TRANSLATOR</text><text x="39" y="75" font-size="17" fill="#c5dcec" font-family="Arial,Noto Sans CJK SC,sans-serif">2× SN74AUP2G80DCU (4× divide by 2) • one SN74AXC1T45DBV (1.8 to 3.3 V)</text><text x="1698" y="58" font-size="21" text-anchor="end" fill="#bfe7ff" font-family="Arial,sans-serif">Rev.C / 03/05</text><rect x="34" y="113" width="1081" height="903" rx="9" stroke="#cbdae6" stroke-width="1.5" fill="#f9fcfe"/><text x="53" y="146" font-size="22" fill="#244b68" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">A. Divide by 16: U3 and U4, DCU-8</text><rect x="1137" y="113" width="581" height="903" rx="9" stroke="#cbdae6" stroke-width="1.5" fill="#f9fcfe"/><text x="1156" y="146" font-size="22" fill="#244b68" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">B. U5 translator, DBV-6</text><rect x="76" y="213" width="100" height="32" rx="5" stroke="#b2d6e9" stroke-width="1.5" fill="#e2f3fc"/><text x="84" y="235" font-size="16" fill="#075f90" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">CLK_TAP</text><rect x="108" y="297" width="203" height="230" rx="5" stroke="#658ba5" stroke-width="1.5" fill="#e9f3fb"/><text x="123" y="328" font-size="22" fill="#153d5a" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">U3A</text><text x="121" y="364" font-size="15" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >1CLK pin1</text><text x="121" y="394" font-size="15" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >1D pin2</text><text x="121" y="422" font-size="15" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >1Qbar pin7</text><text x="124" y="487" font-size="18" fill="#198166" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">D ← Qbar</text><rect x="112" y="246" width="100" height="32" rx="5" stroke="#b2d6e9" stroke-width="1.5" fill="#e2f3fc"/><text x="120" y="268" font-size="16" fill="#075f90" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">CLK_TAP</text><path d="M282 437 H328 V565 H93 V405 H108" fill="none" stroke="#268569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="113" y="594" width="100" height="32" rx="5" stroke="#b2d6e9" stroke-width="1.5" fill="#e2f3fc"/><text x="121" y="616" font-size="16" fill="#075f90" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">DIV2</text><rect x="370" y="297" width="203" height="230" rx="5" stroke="#658ba5" stroke-width="1.5" fill="#e9f3fb"/><text x="385" y="328" font-size="22" fill="#153d5a" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">U3B</text><text x="383" y="364" font-size="15" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >2CLK pin5</text><text x="383" y="394" font-size="15" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >2D pin6</text><text x="383" y="422" font-size="15" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >2Qbar pin3</text><text x="386" y="487" font-size="18" fill="#198166" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">D ← Qbar</text><rect x="374" y="246" width="100" height="32" rx="5" stroke="#b2d6e9" stroke-width="1.5" fill="#e2f3fc"/><text x="382" y="268" font-size="16" fill="#075f90" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">DIV2</text><path d="M544 437 H590 V565 H355 V405 H370" fill="none" stroke="#268569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="375" y="594" width="100" height="32" rx="5" stroke="#b2d6e9" stroke-width="1.5" fill="#e2f3fc"/><text x="383" y="616" font-size="16" fill="#075f90" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">DIV4</text><rect x="632" y="297" width="203" height="230" rx="5" stroke="#658ba5" stroke-width="1.5" fill="#e9f3fb"/><text x="647" y="328" font-size="22" fill="#153d5a" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">U4A</text><text x="645" y="364" font-size="15" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >1CLK pin1</text><text x="645" y="394" font-size="15" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >1D pin2</text><text x="645" y="422" font-size="15" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >1Qbar pin7</text><text x="648" y="487" font-size="18" fill="#198166" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">D ← Qbar</text><rect x="636" y="246" width="100" height="32" rx="5" stroke="#b2d6e9" stroke-width="1.5" fill="#e2f3fc"/><text x="644" y="268" font-size="16" fill="#075f90" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">DIV4</text><path d="M806 437 H852 V565 H617 V405 H632" fill="none" stroke="#268569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="637" y="594" width="100" height="32" rx="5" stroke="#b2d6e9" stroke-width="1.5" fill="#e2f3fc"/><text x="645" y="616" font-size="16" fill="#075f90" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">DIV8</text><rect x="894" y="297" width="203" height="230" rx="5" stroke="#658ba5" stroke-width="1.5" fill="#e9f3fb"/><text x="909" y="328" font-size="22" fill="#153d5a" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">U4B</text><text x="907" y="364" font-size="15" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >2CLK pin5</text><text x="907" y="394" font-size="15" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >2D pin6</text><text x="907" y="422" font-size="15" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >2Qbar pin3</text><text x="910" y="487" font-size="18" fill="#198166" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">D ← Qbar</text><rect x="898" y="246" width="100" height="32" rx="5" stroke="#b2d6e9" stroke-width="1.5" fill="#e2f3fc"/><text x="906" y="268" font-size="16" fill="#075f90" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">DIV8</text><path d="M1068 437 H1114 V565 H879 V405 H894" fill="none" stroke="#268569" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="899" y="594" width="108" height="32" rx="5" stroke="#b2d6e9" stroke-width="1.5" fill="#e2f3fc"/><text x="907" y="616" font-size="16" fill="#075f90" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">DIV16_1V8</text><text x="118" y="697" font-size="18" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >U3 pin 7 → pin 2 and pin 5  |  U3 pin 3 → pin 6 and U4 pin 1</text><text x="118" y="733" font-size="18" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >U4 pin 7 → pin 2 and pin 5  |  U4 pin 3 → pin 6 and U5 A pin 3</text><text x="118" y="770" font-size="18" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >U3/U4: pin 8 = VCC 1V8, pin 4 = GND, 100 nF local bypass each.</text><rect x="74" y="845" width="995" height="118" rx="5" stroke="#e8cf91" stroke-width="1.5" fill="#fff8e8"/><text x="90" y="877" font-size="16" fill="#89541f" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">Verified DCU-8 physical pin sequence: 1CLK=1, 1D=2, 2Qbar=3, GND=4,</text><text x="90" y="904" font-size="16" fill="#6d5839" font-family="Arial,Noto Sans CJK SC,sans-serif" >2CLK=5, 2D=6, 1Qbar=7, VCC=8. Clock outputs are inverted Q, not Q.</text><rect x="1166" y="211" width="108" height="32" rx="5" stroke="#b2d6e9" stroke-width="1.5" fill="#e2f3fc"/><text x="1174" y="233" font-size="16" fill="#075f90" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">DIV16_1V8</text><rect x="1182" y="287" width="492" height="333" rx="5" stroke="#658ba5" stroke-width="1.5" fill="#e8f3fa"/><text x="1214" y="328" font-size="23" fill="#164061" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">U5  SN74AXC1T45DBV</text><text x="1214" y="365" font-size="19" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >1  VCCA = 1V8</text><text x="1214" y="398" font-size="19" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >2  GND  = GND</text><text x="1214" y="431" font-size="19" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >3  A = DIV16_1V8</text><text x="1214" y="464" font-size="19" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >4  B = TIM_ETR_3V3</text><text x="1214" y="497" font-size="19" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >5  DIR = 1V8 (A→B)</text><text x="1214" y="530" font-size="19" fill="#244761" font-family="Arial,Noto Sans CJK SC,sans-serif" >6  VCCB = 3V3</text><text x="1214" y="576" font-size="18" fill="#b25027" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">NO OE PIN on SOT23-6</text><rect x="1183" y="650" width="132" height="32" rx="5" stroke="#b2d6e9" stroke-width="1.5" fill="#e2f3fc"/><text x="1191" y="672" font-size="16" fill="#075f90" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">TIM_ETR_3V3</text><rect x="1180" y="766" width="499" height="165" rx="5" stroke="#e8cf91" stroke-width="1.5" fill="#fff8e8"/><text x="1196" y="798" font-size="16" fill="#89541f" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">10.0–10.216 MHz → /16 = 625–638.5 kHz.</text><text x="1196" y="825" font-size="16" fill="#6d5839" font-family="Arial,Noto Sans CJK SC,sans-serif" >Count using STM32 TIM2 ETR PA15,</text><text x="1196" y="852" font-size="16" fill="#6d5839" font-family="Arial,Noto Sans CJK SC,sans-serif" >not MCU software interrupt edges.</text><text x="1196" y="879" font-size="16" fill="#6d5839" font-family="Arial,Noto Sans CJK SC,sans-serif" >Divider branch never gates RF_CLK.</text><path d="M35 1058h1680" stroke="#9eb4c4"/><text x="40" y="1082" font-size="15" fill="#516778" font-family="Arial,sans-serif">Electrical design draft — netlist.csv defines connectivity — check datasheets, SPICE, ERC and bench before PCB release.</text></svg>