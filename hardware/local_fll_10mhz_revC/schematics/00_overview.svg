ne" stroke="#244761" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M1435 753 L1435 177 L300 177 L300 261" fill="none" stroke="#18966b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="1050" y="189" font-size="21" fill="#10856f" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">Local feedback, never from SDR</text><rect x="140" y="938" width="1430" height="75" rx="5" stroke="#e8cf91" stroke-width="1.5" fill="#fff8e8"/><text x="156" y="970" font-size="16" fill="#89541f" font-family="Arial,Noto Sans CJK SC,sans-serif" font-weight="700">Clock frequency is measured at the RF switch driver branch. Mirrors/harmonics accepted; RF spectrum and 24 kHz adjacency still require bench tests.</text><path d="M35 1058h1680" stroke="#9eb4c4"/><text x="40" y="1082" font-size="15" fill="#516778" font-family="Arial,sans-serif">Electrical design draft — netlist.csv defines connectivity — check datasheets, SPICE, ERC and bench before PCB release.</text></svg>